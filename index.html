    // --- ICON HELPER COMPONENT (Lucide Dynamic Wrapper) ---
    function Icon({ name, size = 18, className = "" }) {
      const ref = useRef(null);
      useEffect(() => {
        if (window.lucide && ref.current) {
          ref.current.innerHTML = '';
          const iconElement = document.createElement('i');
          iconElement.setAttribute('data-lucide', name);
          iconElement.setAttribute('class', className);
          if (size) {
            iconElement.style.width = size + 'px';
            iconElement.style.height = size + 'px';
          }
          ref.current.appendChild(iconElement);
          window.lucide.createIcons({
            attrs: { class: className },
            elements: [ref.current]
          });
        }
      }, [name, size, className]);

      return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size }}></span>;
    }

    // ==========================================
    // GOOGLE OAUTH PROVIDER (SAFE CLIENT ID & GIS BINDING)
    // ==========================================
    const GoogleOAuthContext = createContext({ clientId: "dummy-id-to-prevent-crash.apps.googleusercontent.com" });

    function GoogleOAuthProvider({ clientId, children }) {
      const safeClientId = clientId || "dummy-id-to-prevent-crash.apps.googleusercontent.com";

      useEffect(() => {
        if (typeof window !== "undefined") {
          window.__GOOGLE_CLIENT_ID__ = safeClientId;
        }
      }, [safeClientId]);

      return (
        <GoogleOAuthContext.Provider value={{ clientId: safeClientId }}>
          {children}
        </GoogleOAuthContext.Provider>
      );
    }

    function useGoogleOAuth() {
      return useContext(GoogleOAuthContext);
    }

    // ==========================================
    // GLOBAL AUTHENTICATION CONTEXT (GOOGLE OAUTH & SESSION)
    // ==========================================
    const AuthContext = createContext(null);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(() => {
        try {
          const saved = localStorage.getItem("skillbank_user");
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const [token, setToken] = useState(() => localStorage.getItem("skillbank_token") || null);
      const [loading, setLoading] = useState(false);
      const [authError, setAuthError] = useState(null);

      // Verify and authenticate Google JWT token with FastAPI backend (/api/auth/google)
      const loginWithGoogle = async (credential) => {
        setLoading(true);
        setAuthError(null);
        try {
          const res = await fetch(`${API_BASE_URL}/auth/google`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ credential })
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.detail || `Google authentication failed with HTTP ${res.status}`);
          }

          const data = await res.json();
          setUser(data.user);
          setToken(data.token);
          localStorage.setItem("skillbank_user", JSON.stringify(data.user));
          localStorage.setItem("skillbank_token", data.token);
          return data.user;
        } catch (err) {
          console.error("Google OAuth error:", err);
          setAuthError(err.message || "Failed to sign in with Google.");
          throw err;
        } finally {
          setLoading(false);
        }
      };

      const logout = () => {
        setUser(null);
        setToken(null);
        localStorage.removeItem("skillbank_user");
        localStorage.removeItem("skillbank_token");
      };

      return (
        <AuthContext.Provider value={{
          user,
          token,
          isAuthenticated: !!user,
          loading,
          authError,
          loginWithGoogle,
          logout,
          setUser
        }}>
          {children}
        </AuthContext.Provider>
      );
    }

    function useAuth() {
      const context = useContext(AuthContext);
      if (!context) throw new Error("useAuth must be used within an AuthProvider");

    // --- REUSABLE RADAR CHART (SVG) ---
    function SkillRadarChart({ currentScores, benchmarkScores, labels }) {
      const size = 340;
      const center = size / 2;
      const radius = 120;
      const totalAxes = labels.length;

      const getCoordinates = (value, index) => {
        const angle = (Math.PI * 2 / totalAxes) * index - Math.PI / 2;
        const r = (value / 100) * radius;
        const x = center + r * Math.cos(angle);
        const y = center + r * Math.sin(angle);
        return { x, y };
      };

      const currentPoints = currentScores.map((score, i) => {
        const { x, y } = getCoordinates(score, i);
        return `${x},${y}`;
      }).join(' ');

      const benchmarkPoints = benchmarkScores.map((score, i) => {
        const { x, y } = getCoordinates(score, i);
        return `${x},${y}`;
      }).join(' ');

      return (
        <div className="flex flex-col items-center">
          <div className="relative">
            <svg width={size} height={size} className="overflow-visible">
              {[0.25, 0.5, 0.75, 1.0].map((level, idx) => (
                <circle
                  key={idx}
                  cx={center}
                  cy={center}
                  r={radius * level}
                  fill="none"
                  stroke="#E2E8F0"
                  strokeDasharray={level < 1 ? "4 4" : "none"}
                  strokeWidth="1.2"
                />
              ))}

              {labels.map((label, i) => {
                const angle = (Math.PI * 2 / totalAxes) * i - Math.PI / 2;
                const lineX = center + radius * Math.cos(angle);
                const lineY = center + radius * Math.sin(angle);
                
                const labelRadius = radius + 28;
                const labelX = center + labelRadius * Math.cos(angle);
                const labelY = center + labelRadius * Math.sin(angle);

                return (
                  <g key={i}>
                    <line
                      x1={center}
                      y1={center}
                      x2={lineX}
                      y2={lineY}
                      stroke="#CBD5E1"
                      strokeWidth="1"
                    />
                    <text
                      x={labelX}
                      y={labelY}
                      fontSize="11"
                      fontWeight="600"
                      fill="#475569"
                      textAnchor="middle"
                      dominantBaseline="middle"
                      className="select-none font-sans"
                    >
                      {label}
                    </text>
                  </g>
                );
              })}

              {/* Benchmark Polygon (Dashed Amber) */}
              <polygon
                points={benchmarkPoints}
                fill="rgba(245, 158, 11, 0.12)"
                stroke="#F59E0B"
                strokeWidth="2.5"
                strokeDasharray="5 3"
              />

              {/* Current User Polygon (Solid Blue) */}
              <polygon
                points={currentPoints}
                fill="rgba(37, 99, 235, 0.25)"
                stroke="#2563EB"
                strokeWidth="3"
              />

              {currentScores.map((score, i) => {
                const { x, y } = getCoordinates(score, i);
                return (
                  <circle
                    key={i}
                    cx={x}
                    cy={y}
                    r="4.5"
                    fill="#1E3A8A"
                    stroke="#FFFFFF"
                    strokeWidth="2"
                  />
                );
              })}
            </svg>
          </div>

          <div className="flex items-center gap-6 mt-4 text-xs font-medium text-slate-600 bg-slate-50 px-4 py-2 rounded-full border border-slate-200">
            <div className="flex items-center gap-2">
              <span className="w-3.5 h-3.5 rounded-sm bg-blue-600 inline-block shadow-sm"></span>
              <span>Your Current Level</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="w-3.5 h-3.5 rounded-sm border-2 border-dashed border-amber-500 bg-amber-100 inline-block"></span>
              <span>MoSPI / Industry Benchmark</span>
            </div>
          </div>
        </div>
      );
    }

    // --- DEEP TOPIC QUIZ MODAL COMPONENT (Gemini API Integration) ---
    function TopicQuizModal({ topic, onClose, setGlobalApiError, showToast }) {
      const [loading, setLoading] = useState(true);
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [showExplanation, setShowExplanation] = useState(false);
      const [score, setScore] = useState(0);
      const [isCompleted, setIsCompleted] = useState(false);

      useEffect(() => {
        let isMounted = true;
        const fetchQuiz = async () => {
          setLoading(true);
          try {
            const response = await fetch(`${API_BASE_URL}/quiz/generate-topic`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ topic: topic })
            });
            if (!response.ok) {
              throw new Error(`Server returned HTTP ${response.status}: ${response.statusText}`);
            }
            const data = await response.json();
            if (isMounted) {
              setQuestions(data.questions || []);
            }
          } catch (err) {
            console.error("Error generating topic quiz:", err);
            if (setGlobalApiError) {
              setGlobalApiError("Unable to connect to MoSPI Standards API. Please ensure the server is running or try again later.");
            }
            if (isMounted) {
              // Resilient fallback questions for topic
              setQuestions([
                {
                  id: 1,
                  question: `What is the primary architectural advantage of applying ${topic} in modern enterprise software?`,
                  options: [
                    "Bypasses runtime validation checks for faster response times",
                    `Improves modularity, fault isolation, and scalability for ${topic} implementations`,
                    "Forces all network requests onto a single physical server",
                    "Disables version control on source code repositories"
                  ],
                  correct_index: 1,
                  correct_answer: `Improves modularity, fault isolation, and scalability for ${topic} implementations`,
                  explanation: `Adopting standardized patterns in ${topic} ensures high reliability, testability, and decoupled services.`,
                  topic: topic
                },
                {
                  id: 2,
                  question: `Which quality assurance strategy is best suited for certifying ${topic} before production deployment?`,
                  options: [
                    "Manual inspection of binary hex dumps",
                    "Automated regression testing and continuous integration health checks",
                    "Deploying directly to production on peak load hours",
                    "Disabling error logging"
                  ],
                  correct_index: 1,
                  correct_answer: "Automated regression testing and continuous integration health checks",
                  explanation: "Comprehensive automated test suites validate that updates do not introduce performance regressions or functional errors.",
                  topic: topic
                }
              ]);
            }
          } finally {
            if (isMounted) setLoading(false);
          }
        };
        fetchQuiz();
        return () => { isMounted = false; };
      }, [topic]);

      const handleSelectOption = (idx) => {
        if (showExplanation) return;
        setSelectedOption(idx);
        setShowExplanation(true);
        if (idx === questions[currentIndex].correct_index) {
          setScore(prev => prev + 1);
        }
      };

      const handleNext = () => {
        if (currentIndex + 1 < questions.length) {
          setCurrentIndex(prev => prev + 1);
          setSelectedOption(null);
          setShowExplanation(false);
        } else {
          setIsCompleted(true);
        }
      };

      const currentQ = questions[currentIndex];

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 relative animate-in fade-in zoom-in-95 duration-200 max-h-[90vh] overflow-y-auto">
            <button 
              onClick={onClose}
              className="absolute top-5 right-5 text-slate-400 hover:text-slate-700 p-1 rounded-lg hover:bg-slate-100 transition-all"
            >
              <Icon name="x" size={20} />
            </button>

            {loading && (
              <div className="py-12 text-center space-y-4">
                <div className="w-16 h-16 rounded-2xl bg-blue-50 text-brand-900 mx-auto flex items-center justify-center relative">
                  <Icon name="loader-2" size={32} className="animate-spin text-brand-900" />
                  <span className="w-3 h-3 rounded-full bg-amber-500 absolute -top-1 -right-1 animate-ping"></span>
                </div>
                <div>
                  <h3 className="font-bold text-lg text-slate-900 font-display">Generating test for {topic}...</h3>
                  <p className="text-xs text-slate-500 mt-1">Formulating Bloom's taxonomy assessment questions via Gemini AI</p>
                </div>
                <div className="max-w-xs mx-auto space-y-2 pt-2">
                  <div className="h-2 bg-slate-200 rounded-full animate-pulse"></div>
                  <div className="h-2 bg-slate-200 rounded-full w-3/4 mx-auto animate-pulse"></div>
                </div>
              </div>
            )}

            {!loading && !isCompleted && currentQ && (
              <div>
                <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-bold uppercase tracking-wider bg-blue-50 text-brand-900 px-2 py-0.5 rounded border border-blue-200">
                      {topic} Assessment
                    </span>
                    <span className="text-xs text-slate-400">•</span>
                    <span className="text-xs font-semibold text-slate-500">Question {currentIndex + 1} of {questions.length}</span>
                  </div>
                  <span className="text-xs font-bold text-emerald-600">Score: {score}</span>
                </div>

                {/* Progress bar */}
                <div className="w-full bg-slate-100 h-1.5 rounded-full mb-6 overflow-hidden">
                  <div 
                    className="bg-brand-900 h-full rounded-full transition-all duration-300"
                    style={{ width: `${((currentIndex + 1) / questions.length) * 100}%` }}
                  ></div>
                </div>

                <h4 className="text-base font-bold text-slate-900 mb-5 leading-relaxed">
                  {currentQ.question}
                </h4>

                {/* Options */}
                <div className="space-y-2.5 mb-5">
                  {currentQ.options.map((opt, idx) => {
                    const isSelected = selectedOption === idx;
                    const isCorrect = idx === currentQ.correct_index;
                    let optionStyle = "border-slate-200 hover:border-blue-400 hover:bg-slate-50";
                    
                    if (showExplanation) {
                      if (isCorrect) {
                        optionStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold";
                      } else if (isSelected && !isCorrect) {
                        optionStyle = "border-red-400 bg-red-50 text-red-900";
                      } else {
                        optionStyle = "border-slate-200 opacity-60";
                      }
                    } else if (isSelected) {
                      optionStyle = "border-brand-900 bg-blue-50/70 font-semibold";
                    }

                    return (
                      <button
                        key={idx}
                        disabled={showExplanation}
                        onClick={() => handleSelectOption(idx)}
                        className={`w-full text-left p-3.5 rounded-xl border text-xs sm:text-sm flex items-start gap-3 transition-all ${optionStyle}`}
                      >
                        <span className={`w-5 h-5 rounded-md flex items-center justify-center font-bold text-xs flex-shrink-0 mt-0.5 ${
                          showExplanation && isCorrect 
                            ? 'bg-emerald-600 text-white' 
                            : showExplanation && isSelected && !isCorrect
                              ? 'bg-red-600 text-white'
                              : isSelected 
                                ? 'bg-brand-900 text-white' 
                                : 'bg-slate-100 text-slate-600'
                        }`}>
                          {String.fromCharCode(65 + idx)}
                        </span>
                        <span className="flex-1 leading-snug">{opt}</span>
                        {showExplanation && isCorrect && (
                          <Icon name="check-circle" size={16} className="text-emerald-600 flex-shrink-0" />
                        )}
                        {showExplanation && isSelected && !isCorrect && (
                          <Icon name="x-circle" size={16} className="text-red-500 flex-shrink-0" />
                        )}
                      </button>
                    );
                  })}
                </div>

                {/* Explanation card */}
                {showExplanation && (
                  <div className="p-4 rounded-xl bg-blue-50/80 border border-blue-200 mb-5 animate-in fade-in duration-200">
                    <div className="flex items-center gap-1.5 text-brand-900 font-bold text-xs mb-1">
                      <Icon name="lightbulb" size={14} className="text-amber-500" />
                      <span>Pedagogical Rationale:</span>
                    </div>
                    <p className="text-xs text-slate-700 leading-relaxed">
                      {currentQ.explanation}
                    </p>
                  </div>
                )}

                <div className="flex justify-end pt-2">
                  {showExplanation ? (
                    <button
                      onClick={handleNext}
                      className="px-5 py-2.5 bg-brand-900 hover:bg-brand-800 text-white font-bold text-xs rounded-xl shadow-sm flex items-center gap-2"
                    >
                      <span>{currentIndex + 1 === questions.length ? "View Final Score" : "Next Question"}</span>
                      <Icon name="arrow-right" size={15} />
                    </button>
                  ) : (
                    <span className="text-xs text-slate-400 italic">Select an option above to verify answer</span>
                  )}
                </div>
              </div>
            )}

            {!loading && isCompleted && (
              <div className="py-6 text-center space-y-5">
                <div className="w-16 h-16 rounded-2xl bg-amber-100 text-amber-600 mx-auto flex items-center justify-center">
                  <Icon name="award" size={36} />
                </div>
                <div>
                  <span className="text-xs font-bold text-blue-700 bg-blue-50 px-3 py-1 rounded-full border border-blue-200">
                    {topic} Assessment Complete
                  </span>
                  <h3 className="font-bold text-2xl text-slate-900 font-display mt-2">
                    Score: {score} / {questions.length} ({questions.length ? Math.round((score / questions.length) * 100) : 0}%)
                  </h3>
                  <p className="text-xs text-slate-500 max-w-sm mx-auto mt-1.5">
                    {score >= Math.ceil(questions.length * 0.7) 
                      ? "Great job! You demonstrated strong proficiency in this competency area." 
                      : "Keep practicing! We recommend reviewing the aligned iGOT Karmayogi modules to strengthen this skill."}
                  </p>
                </div>
                <div className="pt-2 flex justify-center gap-3">
                  <button
                    onClick={() => {
                      setCurrentIndex(0);
                      setSelectedOption(null);
                      setShowExplanation(false);
                      setScore(0);
                      setIsCompleted(false);
                    }}
                    className="px-4 py-2 border border-slate-300 text-slate-700 font-bold text-xs rounded-xl hover:bg-slate-50 flex items-center gap-1.5"
                  >
                    <Icon name="rotate-ccw" size={14} /> Retake Test
                  </button>
                  <button
                    onClick={onClose}
                    className="px-5 py-2 bg-brand-900 hover:bg-brand-800 text-white font-bold text-xs rounded-xl shadow-sm"
                  >
                    Back to Gap Matrix
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // DYNAMIC GOOGLE AUTHENTICATION MODAL (SIGNINMODAL)

    function SignInModal({ isOpen, onClose, showToast, onSuccess }) {
      const { loginWithGoogle, loading, authError } = useAuth();
      const { clientId } = useGoogleOAuth();
      const [localError, setLocalError] = useState(null);
      const [isAuthenticating, setIsAuthenticating] = useState(false);
      const googleBtnContainerRef = useRef(null);

      // Mount Google Identity Services (GIS) client and button
      useEffect(() => {
        if (isOpen && window.google && window.google.accounts && window.google.accounts.id) {
          try {
            window.google.accounts.id.initialize({
              client_id: clientId || "dummy-id-to-prevent-crash.apps.googleusercontent.com",
              callback: async (response) => {
                if (response && response.credential) {
                  setIsAuthenticating(true);
                  setLocalError(null);
                  try {
                    const loggedInUser = await loginWithGoogle(response.credential);
                    showToast(`Authenticated as ${loggedInUser.name} (${loggedInUser.email})`);
                    if (onSuccess) onSuccess(loggedInUser);
                    onClose();
                  } catch (err) {
                    setLocalError(err.message || "Google token verification failed.");
                  } finally {
                    setIsAuthenticating(false);
                  }
                }
              }
            });

            // If container is rendered, display native Google Sign In button
            if (googleBtnContainerRef.current) {
              googleBtnContainerRef.current.innerHTML = '';
              window.google.accounts.id.renderButton(googleBtnContainerRef.current, {
                theme: "outline",
                size: "large",
                width: 320,
                text: "continue_with",
                shape: "pill"
              });
            }
          } catch (e) {
            console.warn("Google Identity Services note:", e);
          }
        }
      }, [isOpen]);

      if (!isOpen) return null;

      const handleGoogleClick = async () => {
        setIsAuthenticating(true);
        setLocalError(null);
        try {
          if (!clientId || clientId.includes("dummy-id")) {
            setLocalError("Google Client ID is missing or invalid. Please paste your Google OAuth Client ID in your .env file or inside index.html (window.VITE_GOOGLE_CLIENT_ID). Google will throw 401 invalid_client until a real Client ID from Google Cloud Console is configured.");
            setIsAuthenticating(false);
            return;
          }

          if (window.google && window.google.accounts && window.google.accounts.id) {
            // Trigger Google account selector popup / One Tap
            window.google.accounts.id.prompt((notification) => {
              if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                console.info("Google One Tap dismissed or not displayed. The user can click the Google button.");
              }
            });
          } else {
            setLocalError("Google Identity Services SDK is initializing. Please check your internet connection.");
          }
        } catch (err) {
          setLocalError(err.message || "Google authentication encountered an issue.");
        } finally {
          setIsAuthenticating(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/65 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-slate-200 relative animate-in fade-in zoom-in-95 duration-200">
            <button 
              onClick={onClose}
              className="absolute top-5 right-5 text-slate-400 hover:text-slate-700 p-1.5 rounded-xl hover:bg-slate-100 transition-colors"
            >
              <Icon name="x" size={18} />
            </button>

            {/* Brand Header */}
            <div className="flex items-center gap-3.5 mb-6">
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-900 to-blue-600 text-amber-400 flex items-center justify-center shadow-md shadow-blue-900/15 flex-shrink-0">
                <Icon name="landmark" size={24} />
              </div>
              <div>
                <h3 className="font-extrabold text-xl text-slate-900 font-display tracking-tight">MoSPI Candidate Portal</h3>
                <p className="text-xs text-slate-500">Sign in with your Google account to sync your profile</p>
              </div>
            </div>

            {/* Error Banner */}
            {(localError || authError) && (
              <div className="mb-5 p-3.5 rounded-xl bg-red-50 border border-red-200 text-xs font-semibold text-red-700 flex items-center gap-2">
                <Icon name="alert-circle" size={16} className="text-red-600 flex-shrink-0" />
                <span className="leading-snug">{localError || authError}</span>
              </div>
            )}

            {/* ONLY THE REAL GOOGLE AUTHENTICATION ACTION */}
            <div className="space-y-4 mb-6">
              {/* Optional GIS Native Container */}
              <div ref={googleBtnContainerRef} className="flex justify-center w-full min-h-[44px]"></div>

              {/* Styled Primary Google Action Button */}
              <button
                type="button"
                disabled={isAuthenticating || loading}
                onClick={handleGoogleClick}
                className="w-full py-3.5 px-4 bg-white hover:bg-slate-50 border-2 border-slate-200 hover:border-slate-300 rounded-2xl text-sm font-bold text-slate-800 transition-all duration-200 shadow-sm hover:shadow-md flex items-center justify-center gap-3 active:scale-98 group cursor-pointer"
              >
                {/* Official Google Multi-color G Logo SVG */}
                <svg className="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                  <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
                  <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                  <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                <span>{isAuthenticating || loading ? "Connecting with Google..." : "Continue with Google"}</span>
              </button>

              <p className="text-[11px] text-center text-slate-500 leading-relaxed">
                Connect using your personal or university Google Account. Your assessment progress, identified skill gaps, and iGOT courses will sync directly with MongoDB.
              </p>
            </div>

            {/* Footer Trust Indicator */}
            <div className="pt-4 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
              <div className="flex items-center gap-1.5">
                <Icon name="lock" size={13} className="text-emerald-600" />
                <span>Google OAuth 2.0 Verified</span>
              </div>
              <span className="font-semibold text-slate-500">MongoDB Sync Enabled</span>
            </div>
          </div>
        </div>
      );
    }
